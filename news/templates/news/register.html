{% extends "base.html" %}
{% block title %}Register{% endblock title %}
{% block content %}
    <h1>Register</h1>
    <form method="POST" action="{% url 'news:register' %}">
        {% csrf_token %}
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <label for="password_conf">Confirm password</label>
        <input type="password" id="password_conf" name="password_conf" required>

        <!-- Role: decides the user's group -->
        <label>I am a</label>
        <label class="radio-option"><input type="radio" name="role" value="reader" checked> Reader</label>
        <label class="radio-option"><input type="radio" name="role" value="journalist"> Journalist</label>
        <label class="radio-option"><input type="radio" name="role" value="editor"> Editor</label>
        <label class="radio-option"><input type="radio" name="role" value="publisher"> Publisher</label>

        <!-- Only needed for publishers: their publication is created for them -->
        <label for="publication_name">Publication name (publishers only)</label>
        <input type="text" id="publication_name" name="publication_name">

        <br>
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="{% url 'news:login' %}">Login here</a></p>
{% endblock content %}
