{% extends "base.html" %}
{% block title %}Delete{% endblock title %}
{% block content %}
    <h1>Delete "{{ item }}"?</h1>
    <p>This cannot be undone.</p>
    <form class="inline-form" method="POST">
        {% csrf_token %}
        <button class="btn-danger" type="submit">🗑️ Yes, delete</button>
    </form>
    <a class="btn" href="javascript:history.back()">Cancel</a>
{% endblock content %}
